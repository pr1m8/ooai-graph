[project]
name = "ooai-graph"
version = "0.1.0"
description = "OOAI Graph - Graph-based computation and workflow management"
dependencies = ["pydantic>=2.11.9", "pydantic-settings", "typing-extensions>=4.15.0"]
requires-python = "==3.13.7"
readme = "README.md"

[[project.authors]]
name = "William Astley"
email = "william.astley@algebraicwealth.com"

[project.license]
text = "MIT"

[tool.pytest.ini_options]
minversion = "8.0"
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*", "*Tests", "*TestCase"]
python_functions = ["test_*", "*_test"]
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]
norecursedirs = ["*.egg", ".eggs", "dist", "build", "docs", ".tox", ".git", "__pycache__", ".venv", "venv", ".pytest_cache", ".mypy_cache", ".ruff_cache", "node_modules", ".hypothesis"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--showlocals", "--tb=short", "--verbosity=2", "--disable-warnings", "-p no:warnings", "--durations=10", "--durations-min=0.1", "--color=yes", "--code-highlight=yes"]
markers = ["unit: Unit tests (fast, isolated)", "integration: Integration tests (may require external services)", "slow: Tests that take > 5 seconds", "fast: Tests that take < 0.1 seconds"]
console_output_style = "progress"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] [%(name)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/tests/*", "*/test_*.py", "*/__pycache__/*", "*/site-packages/*", "*/distutils/*", "*/.venv/*", "*/venv/*", "*/.tox/*", "*/migrations/*", "*/versions/*", "*/conftest.py", "*/setup.py", "*/__main__.py", "*/.eggs/*", "*/build/*", "*/dist/*", "*/node_modules/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
fail_under = 80.0
exclude_lines = ["pragma: no cover", "def __repr__", "def __str__", "if self.debug:", "if settings.DEBUG", "if DEBUG", "if TYPE_CHECKING:", "if typing.TYPE_CHECKING:", "@typing.overload", "@overload", "raise AssertionError", "raise NotImplementedError", "except ImportError:", "@abc.abstractmethod", "@abstractmethod", "if __name__ == .__main__.:", "assert False", "pass", "\\.\\.\\."]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [".bzr", ".direnv", ".eggs", ".git", ".hg", ".mypy_cache", ".nox", ".pants.d", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv", "__pypackages__", "_build", "buck-out", "build", "dist", "node_modules", "venv", ".venv", ".trunk", ".hypothesis", ".pytest_cache", ".benchmarks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PL", "RUF", "D", "ANN", "S", "T20", "PT", "Q"]
ignore = ["E203", "E501", "B008", "C901", "N802", "PLR0913", "PLR0912", "PLR0915", "PLC0415", "SIM108", "UP007", "D100", "D104", "D105", "D107", "D203", "D213", "ANN101", "ANN102", "ANN401", "S101", "T201"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D"]
"test_*.py" = ["S101", "PLR2004", "ANN", "D"]
"tests/**" = ["S101", "PLR2004", "ANN", "D"]
"examples/**" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["ooai"]
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 88
target-version = ["py313"]
include = "\\.pyi?$"

[tool.pdm]
distribution = true

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

